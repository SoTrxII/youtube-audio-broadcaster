name: Test

# No daily schedule anymore: it existed to catch ytdl-core breaking against
# YouTube, and yt-dlp now updates itself at pod start instead
on:
  push:
    branches:
      - master

jobs:
  func-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v3
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - run: pnpm install

      - name: Execute tests
        run: pnpm run test
